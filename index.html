<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEAR.US</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: #333;
    }
    .card {
      background: #fff;
      padding: 2.5rem 3rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 420px;
    }
    h1 {
      margin-top: 0;
      color: #2575fc;
    }
    p {
      line-height: 1.6;
    }
    button {
      margin-top: 1rem;
      padding: 0.7rem 1.6rem;
      border: none;
      border-radius: 8px;
      background: #2575fc;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #6a11cb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to DEAR.US</h1>
    <p>This is a simple HTML page. Edit this file to add your own content.</p>
    <button onclick="alert('Hello! 👋')">Say Hello</button>
  </div>
</body>
</html>
