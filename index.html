<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#231158">
  <title>DEAR.US</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #231158;
      color: #fff;
      isolation: isolate;
    }
    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -1;
      background: linear-gradient(125deg, #160d36, #48218b, #163b86, #32135f);
      background-size: 300% 300%;
      animation: gradient 18s ease infinite;
    }
    .orb {
      position: absolute;
      width: 34vmax;
      height: 34vmax;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ba91ff80, #9660ff10 70%);
      border: 1px solid #ffffff12;
      animation: float 12s ease-in-out infinite alternate;
    }
    .orb:nth-child(1) { top: -12%; left: -7%; }
    .orb:nth-child(2) { bottom: -18%; right: -6%; animation-delay: -5s; background: radial-gradient(circle at 35% 30%, #45cfff60, #45cfff05 70%); }
    .orb:nth-child(3) { width: 12vmax; height: 12vmax; right: 17%; top: 15%; animation-delay: -8s; }
    .card {
      width: min(100%, 510px);
      padding: clamp(2rem, 7vw, 3.5rem);
      border: 1px solid #ffffff30;
      border-radius: 28px;
      background: #ffffff0d;
      backdrop-filter: blur(24px);
      box-shadow: 0 30px 90px #09051f50, inset 0 1px #ffffff15;
      text-align: center;
      animation: enter 900ms cubic-bezier(.16, 1, .3, 1) both;
    }
    .badge { display: inline-flex; align-items: center; gap: .5rem; padding: .45rem .8rem; border-radius: 999px; background: #ffffff0d; border: 1px solid #ffffff1f; color: #ded4ff; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #9af6d0; box-shadow: 0 0 12px #9af6d0; }
    h1 { margin: 1.7rem 0 1rem; font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1.12; letter-spacing: -.05em; }
    h1 span { display: block; color: #c9b0ff; }
    p { margin: 0; color: #d3cbe7; line-height: 1.8; font-size: .98rem; }
    button {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      gap: .85rem;
      margin-top: 2rem;
      padding: .95rem 1.6rem;
      border: 1px solid #ffffff60;
      border-radius: 12px;
      background: #eee7ff;
      color: #382060;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 6px 24px #0d062c30;
      transition: transform 200ms ease, background 200ms ease, box-shadow 200ms ease;
    }
    button:hover { transform: translateY(-4px); background: #fff; box-shadow: 0 12px 30px #0d062c50; }
    button:active { transform: translateY(-1px) scale(.98); }
    button:focus-visible { outline: 3px solid #9af6d0; outline-offset: 5px; }
    .wave { display: inline-block; transform-origin: 75% 75%; }
    button:hover .wave, button.greeting .wave { animation: wave 650ms ease-in-out 2; }
    .message { min-height: 3.6em; margin-top: 1.5rem; font-size: .85rem; color: #bfb0da; }
    .message.reveal { animation: enter 450ms ease both; color: #b5f6de; }
    @keyframes gradient { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes float { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(35px, 55px, 0); } }
    @keyframes enter { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes wave { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(24deg); } 75% { transform: rotate(-12deg); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      button:hover, button:active { transform: none; }
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true">
    <div class="orb"></div><div class="orb"></div><div class="orb"></div>
  </div>
  <main class="card">
    <div class="badge">A little space for connection</div>
    <h1>Welcome to <span>DEAR.US</span></h1>
    <p>Every connection starts with a hello.<br>We're happy you're here.</p>
    <button type="button" id="hello">Say Hello <span class="wave" aria-hidden="true">👋</span></button>
    <p class="message" id="message" role="status" aria-live="polite">Something good starts here.</p>
  </main>
  <script>
    const button = document.getElementById('hello');
    const message = document.getElementById('message');
    button.addEventListener('click', () => {
      button.classList.remove('greeting');
      message.classList.remove('reveal');
      // Restart the short greeting animation on repeated clicks.
      void button.offsetWidth;
      message.textContent = 'Hello, you! Thanks for stopping by. 💜';
      button.classList.add('greeting');
      message.classList.add('reveal');
    });
  </script>
</body>
</html>
